    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#b9f4bf"/><stop offset="1" stop-color="#66c9ad"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#173e3d"/><stop offset="1" stop-color="#153241"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#001111" flood-opacity=".35"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#82dfba" opacity=".14"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="26" fill="url(#dots)"/>
